name: DEM manifest

# Records in mapping/dem-manifest.json the release of the dem and contours layers of every region in the layers.json of a release,
# with the current fingerprint of their sources (scripts/dem-source.py update: Copernicus tile list and outline from the repository,
# ČÚZK DMR 4G ATOM feed for the Czech Republic, read once), and proposes the change as a pull request.
# Run after a release has been finalized; no schedule.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release whose layers.json is recorded (layers-YYYY-MM...), or latest"
        default: latest

permissions:
  contents: read

concurrency:
  group: update-dem-manifest
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.update.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -o pipefail
          [[ "$TAG" =~ ^(latest|layers-[0-9]{4}-[0-9]{2}[a-z0-9-]*)$ ]] || { echo "Invalid tag: $TAG" >&2; exit 2; }
          if [ "$TAG" = latest ]; then TAG=$(gh release view --json tagName --jq .tagName); fi
          echo "Release $TAG" | tee update.log
          gh release download "$TAG" --pattern layers.json --dir "$RUNNER_TEMP" --clobber
          rc=0
          python3 scripts/dem-source.py update "$RUNNER_TEMP/layers.json" 2>&1 | tee -a update.log || rc=$?
          python3 scripts/dem-source.py check "$RUNNER_TEMP/layers.json" 2>&1 | tee -a update.log || rc=$?
          git add -A mapping/dem-manifest.json
          git diff --cached --stat
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          git diff --cached --binary > update.patch
          {
            echo "### DEM manifest"
            echo '```'
            tail -n 20 update.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.update.outputs.changed == 'true' }}
        with:
          name: update-patch
          path: |
            update.patch
            update.log
          retention-days: 7

  # Only this job may write: it pushes the branch update/dem-manifest and opens (or updates) the pull request.
  pull-request:
    needs: update
    if: ${{ needs.update.outputs.changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-patch
          path: ${{ runner.temp }}/update
      - name: Pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch=update/dem-manifest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git apply --index "$RUNNER_TEMP/update/update.patch"
          git commit -q -m "Record the dem and contours releases in the manifest" -m "Generated by the DEM manifest workflow: $RUN_URL"
          git push -f origin "$branch"
          {
            echo "mapping/dem-manifest.json updated by scripts/dem-source.py update from the layers.json of the release named in the log."
            echo
            echo "Run: $RUN_URL"
            echo
            echo "<pre>"
            tail -n 30 "$RUNNER_TEMP/update/update.log"
            git show --stat --format= HEAD | tail -n 10
            echo "</pre>"
          } > "$RUNNER_TEMP/body.md"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$branch" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --draft --base main --head "$branch" --title "Record the dem and contours releases in the manifest" --body-file "$RUNNER_TEMP/body.md"
          fi
