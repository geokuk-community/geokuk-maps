name: OSM test sample

# Keeps the small OSM extracts in tests/osm that the pull request checks of Layers use (osm_source=sample), so that those checks
# need neither Geofabrik nor the whole planet. The extract is taken from the artifact osm-<region> of a Layers run with
# osm_source=aws (cut from the weekly planet), with its planet.txt, and proposed as a pull request.
# Run it after such a Layers run, within the 1-day retention of its artifacts; no schedule.
on:
  workflow_dispatch:
    inputs:
      from_run:
        description: "Run id of a Layers run with osm_source=aws that built the regions below"
        required: true
      regions:
        description: "Region keys separated by spaces (each sample must stay below 5 MB)"
        default: "europe/monaco"

permissions:
  contents: read

concurrency:
  group: update-osm-sample
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      changed: ${{ steps.update.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the source run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FROM_RUN: ${{ inputs.from_run }}
          MODE: draft
        run: |
          [ -n "$FROM_RUN" ] || { echo "from_run is required" >&2; exit 1; }
          scripts/check-run.sh
      # Only the region extracts osm-<region>, not the blocks osm-block-* (several GB each).
      - id: pattern
        env:
          REGIONS: ${{ inputs.regions }}
        run: |
          read -ra keys <<< "$REGIONS"
          [ ${#keys[@]} -gt 0 ] || { echo "No regions" >&2; exit 2; }
          names=()
          for k in "${keys[@]}"; do
            [[ "$k" =~ ^[a-z0-9-]+(/[a-z0-9-]+)*$ ]] || { echo "Invalid key: $k" >&2; exit 2; }
            names+=("osm-${k//\//_}")
          done
          if [ ${#names[@]} -eq 1 ]; then pattern=${names[0]}; else pattern="{$(IFS=,; echo "${names[*]}")}"; fi
          echo "pattern=$pattern" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ steps.pattern.outputs.pattern }}
          path: ${{ runner.temp }}/osm
          run-id: ${{ inputs.from_run }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - id: update
        env:
          REGIONS: ${{ inputs.regions }}
          FROM_RUN: ${{ inputs.from_run }}
          SRC: ${{ runner.temp }}/osm
        run: |
          set -o pipefail
          read -ra keys <<< "$REGIONS"
          mkdir -p tests/osm
          for k in "${keys[@]}"; do
            [[ "$k" =~ ^[a-z0-9-]+(/[a-z0-9-]+)*$ ]] || { echo "Invalid key: $k" >&2; exit 2; }
            base=${k//\//_}
            dir="$SRC/osm-$base"
            # download-artifact puts a single matching artifact straight into the path (see publish.sh).
            [ -d "$dir" ] || [ ${#keys[@]} -ne 1 ] || dir=$SRC
            [ -s "$dir/region.osm.pbf" ] && [ -s "$dir/planet.txt" ] || { echo "Artifact osm-$base is not in run $FROM_RUN" >&2; exit 1; }
            size=$(stat -c %s "$dir/region.osm.pbf")
            [ "$size" -lt 5242880 ] || { echo "$k: $size bytes is too large for a sample in the repository" >&2; exit 1; }
            grep -qE '^planet-[0-9]{6}	[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]+Z$' "$dir/planet.txt" || { echo "$k: unexpected planet.txt" >&2; exit 1; }
            cp "$dir/region.osm.pbf" "tests/osm/$base.osm.pbf"
            cp "$dir/planet.txt" "tests/osm/$base.txt"
            echo "$k: $size bytes, $(cut -f1 "$dir/planet.txt")" | tee -a update.log
          done
          git add -A tests/osm
          git diff --cached --stat
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          git diff --cached --binary > update.patch
          {
            echo "### OSM test sample"
            echo '```'
            cat update.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.update.outputs.changed == 'true' }}
        with:
          name: update-patch
          path: |
            update.patch
            update.log
          retention-days: 7

  # Only this job may write: it pushes the branch update/osm-sample and opens (or updates) the pull request.
  pull-request:
    needs: update
    if: ${{ needs.update.outputs.changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-patch
          path: ${{ runner.temp }}/update
      - name: Pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FROM_RUN: ${{ inputs.from_run }}
        run: |
          branch=update/osm-sample
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git apply --index "$RUNNER_TEMP/update/update.patch"
          git commit -q -m "Refresh the OSM test samples" -m "Generated by the OSM test sample workflow from Layers run $FROM_RUN: $RUN_URL"
          git push -f origin "$branch"
          {
            echo "OSM samples in tests/osm taken from the artifacts osm-<region> of Layers run $FROM_RUN (cut from the weekly planet)."
            echo
            echo "Run: $RUN_URL"
            echo
            echo "<pre>"
            cat "$RUNNER_TEMP/update/update.log"
            git show --stat --format= HEAD | tail -n 10
            echo "</pre>"
          } > "$RUNNER_TEMP/body.md"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$branch" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --draft --base main --head "$branch" --title "Refresh the OSM test samples" --body-file "$RUNNER_TEMP/body.md"
          fi
