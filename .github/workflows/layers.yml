name: Layers

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Geofabrik region path = mapsforge map key (europe/czech-republic, europe/germany/bayern)"
        default: "europe/luxembourg"
      name:
        description: "Region name for the catalog (Czechia, Bavaria)"
        default: "Luxembourg"
      bbox:
        description: "Area: south,west,north,east"
        default: "49.4,5.7,50.2,6.55"
      types:
        description: "Layers to build (contours need dem)"
        type: choice
        options: [all, routes, dem, contours]
        default: all
      parallel:
        description: "Concurrent pyhgtmap processes for contours"
        default: "2"
      writer:
        description: "Map writer for routes: ram (fast, memory-hungry) or hd"
        type: choice
        options: [ram, hd]
        default: ram
      publish:
        description: "none = artifacts only, draft = upload to a draft release, release = publish the release (main only)"
        type: choice
        options: [none, draft, release]
        default: none
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/layers.yml"
      - "scripts/**"
      - "mapping/**"

permissions:
  contents: read

concurrency:
  group: layers-${{ github.ref }}-${{ inputs.region || 'pr' }}
  cancel-in-progress: true

env:
  REGION: ${{ inputs.region || 'europe/luxembourg' }}
  NAME: ${{ inputs.name || 'Luxembourg' }}
  BBOX: ${{ inputs.bbox || '49.4,5.7,50.2,6.55' }}
  TYPES: ${{ inputs.types || 'all' }}
  JAVA_OPTS: -Xmx10g
  WRITER_TYPE: ${{ inputs.writer || 'ram' }}
  PARALLEL: ${{ inputs.parallel || '2' }}

jobs:
  routes:
    if: ${{ inputs.types == 'all' || inputs.types == 'routes' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          scripts/install-tools.sh
      - name: Routes
        run: |
          export BASE=${REGION//\//_}
          OUT="$PWD/out" WORK="$PWD/work" scripts/build-routes.sh
      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "### Routes – $REGION"
            echo '| step | time [s] | RAM [MB] | rc |'
            echo '|---|---|---|---|'
            [ -f out/measurements.tsv ] && awk -F'\t' '{printf "| %s | %s | %s | %s |\n",$1,$2,$3,$4}' out/measurements.tsv
            echo
            ls -l out
            df -h / | tail -1
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: layer-routes
          path: |
            out/*.map
            out/*.poly
            out/measurements.tsv
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: meta-routes
          retention-days: 14
          path: |
            out/*.meta.json
            out/*.poly

  dem:
    if: ${{ inputs.types == 'all' || inputs.types == 'dem' || inputs.types == 'contours' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin python3-numpy zip
      - name: DEM
        run: |
          export BASE=${REGION//\//_}
          OUT="$PWD/out" WORK="$PWD/work" scripts/build-dem.sh
      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "### DEM – $REGION"
            echo '| step | time [s] | RAM [MB] | rc |'
            echo '|---|---|---|---|'
            [ -f out/measurements.tsv ] && awk -F'\t' '{printf "| %s | %s | %s | %s |\n",$1,$2,$3,$4}' out/measurements.tsv
            echo
            ls -l out
            df -h / | tail -1
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: layer-dem
          path: |
            out/*.zip
            out/measurements.tsv
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: meta-dem
          retention-days: 14
          path: out/*.meta.json

  contours:
    needs: dem
    if: ${{ !cancelled() && needs.dem.result == 'success' && (inputs.types == 'all' || inputs.types == 'contours' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@v8
        with:
          name: layer-dem
          path: dem
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool unzip
          python3 -m venv "$HOME/venv"
          "$HOME/venv/bin/pip" install -q -r scripts/requirements.txt
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"
          scripts/install-tools.sh
      - name: Contours
        run: |
          export BASE=${REGION//\//_}
          HGT_ZIP="$PWD/dem/${BASE}.dem.zip" OUT="$PWD/out" WORK="$PWD/work" WRITER_TYPE=hd scripts/build-contours.sh
      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "### Contours – $REGION"
            echo '| step | time [s] | RAM [MB] | rc |'
            echo '|---|---|---|---|'
            [ -f out/measurements.tsv ] && awk -F'\t' '{printf "| %s | %s | %s | %s |\n",$1,$2,$3,$4}' out/measurements.tsv
            echo
            ls -l out
            df -h / | tail -1
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: layer-contours
          path: |
            out/*.map
            out/measurements.tsv
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: meta-contours
          retention-days: 14
          path: out/*.meta.json

  catalog:
    needs: [routes, dem, contours]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.routes.result == 'success' || needs.dem.result == 'success' || needs.contours.result == 'success') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: meta-*
          merge-multiple: true
          path: catalog
      - name: Catalog
        run: |
          python3 scripts/build-catalog.py catalog "$REGION" "$NAME" "$BBOX" "layers-$(date -u +%Y-%m)/"
          cat catalog/layers.json
      - uses: actions/upload-artifact@v7
        with:
          name: layers-catalog
          retention-days: 14
          path: |
            catalog/layers.json
            catalog/SHA256SUMS

  publish:
    needs: catalog
    if: ${{ !cancelled() && needs.catalog.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.publish != 'none' && (inputs.publish == 'draft' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    concurrency:
      group: layers-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: "{layer-*,layers-catalog}"
          merge-multiple: true
          path: upload
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.publish }}
          DIR: ${{ github.workspace }}/upload
        run: scripts/publish.sh
