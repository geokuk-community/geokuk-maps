name: Layers

on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Geofabrik paths = mapsforge map keys, separated by spaces or commas (europe/luxembourg europe/germany/bayern)"
        default: "europe/luxembourg"
      types:
        description: "Layers to build"
        type: choice
        options: [all, tourist, dem, contours]
        default: all
      parallel:
        description: "Concurrent pyhgtmap processes for contours"
        default: "2"
      writer:
        description: "Map writer for the tourist layer: ram (fast, memory-hungry), hd, or auto (hd when the filtered input exceeds 400 MB)"
        type: choice
        options: [auto, ram, hd]
        default: auto
      publish:
        description: "none = artifacts only, draft = upload to a draft release, release = build, upload and publish (main only), finalize = verify the draft release and publish it without building (main only), check = the same verification without publishing"
        type: choice
        options: [none, draft, release, finalize, check]
        default: none
      tag:
        description: "Release tag layers-YYYY-MM[suffix]; default layers-<current year-month> (a published tag cannot be reused, use a suffix such as layers-2026-10b)"
        default: ""
      from_run:
        description: "Publish the artifacts of this earlier run (run id) without building; use with publish=draft or release"
        default: ""
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/layers.yml"
      - "scripts/**"
      - "mapping/**"

permissions:
  contents: read

concurrency:
  group: layers-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      borders: ${{ steps.list.outputs.borders }}
    steps:
      - id: list
        env:
          REGIONS: ${{ inputs.regions || 'europe/luxembourg' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          regions = [r for r in re.split(r'[\s,]+', os.environ['REGIONS']) if r]
          for r in regions:
              if not re.fullmatch(r'[a-z0-9-]+(/[a-z0-9-]+)*(=[a-z0-9-]+(/[a-z0-9-]+)*)?(:[1-9][0-9]*/[1-9][0-9]*(/(lat|lon))?)?', r):
                  raise SystemExit('Invalid region: ' + r)
          print('matrix=' + json.dumps({'region': sorted(set(regions))}))
          print('borders=' + json.dumps({'region': sorted({r.split(':')[0] for r in regions})}))
          PY

  border:
    needs: plan
    if: ${{ !contains(fromJSON('["finalize", "check"]'), inputs.publish) && inputs.from_run == '' && contains(fromJSON('["all", "dem", "contours", ""]'), inputs.types) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.borders) }}
    env:
      REGION: ${{ matrix.region }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          python3 -m venv "$HOME/venv"
          "$HOME/venv/bin/pip" install -q -r scripts/requirements.txt
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"
      - name: Border
        run: |
          KEY=${REGION%%=*}
          export GEOFABRIK=${REGION#*=} BASE=${KEY//\//_} OUT="$PWD/out" WORK="$PWD/work"
          mkdir -p out work
          scripts/build-border.sh "$OUT/border.poly"
          cat out/measurements.tsv
      - id: art
        run: |
          KEY=${REGION%%=*}
          echo "name=border-${KEY//\//_}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.art.outputs.name }}
          path: out/border.poly
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [plan, border]
    if: ${{ !cancelled() && needs.border.result != 'cancelled' && !contains(fromJSON('["finalize", "check"]'), inputs.publish) && inputs.from_run == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      REGION: ${{ matrix.region }}
      TYPES: ${{ inputs.types || 'all' }}
      WRITER_TYPE: ${{ inputs.writer || 'auto' }}
      PARALLEL: ${{ inputs.parallel || '2' }}
      JAVA_OPTS: -Xmx10g
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool gdal-bin python3-numpy zip unzip
          python3 -m venv "$HOME/venv"
          "$HOME/venv/bin/pip" install -q -r scripts/requirements.txt
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"
          scripts/install-tools.sh
      - name: Region border
        if: ${{ needs.border.result == 'success' }}
        run: |
          KEY=${REGION%%:*}; KEY=${KEY%%=*}
          echo "BORDER_NAME=border-${KEY//\//_}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.border.result == 'success' }}
        continue-on-error: true
        with:
          name: ${{ env.BORDER_NAME }}
          path: border
      - name: Build
        run: |
          [ -s border/border.poly ] && export BORDER_POLY="$PWD/border/border.poly"
          OUT="$PWD/out" WORK="$PWD/work" scripts/build-region.sh
      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "### $REGION"
            echo '| step | time [s] | RAM [MB] | rc |'
            echo '|---|---|---|---|'
            [ -f out/measurements.tsv ] && awk -F'\t' '{printf "| %s | %s | %s | %s |\n",$1,$2,$3,$4}' out/measurements.tsv
            echo
            ls -l out
            df -h / | tail -1
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Artifact name
        id: art
        run: |
          KEY=${REGION%%:*}; KEY=${KEY%%=*}
          if [[ "$REGION" == *:* ]]; then SPEC=${REGION##*:}; KEY="$KEY-p${SPEC%%/*}"; fi
          echo "name=region-${KEY//\//_}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.art.outputs.name }}
          path: |
            out/*.map
            out/*.zip
            out/*.poly
            out/layers.json
            out/SHA256SUMS
            out/measurements.tsv
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: ${{ !cancelled() && (needs.build.result != 'skipped' || inputs.from_run != '') && github.event_name == 'workflow_dispatch' && contains(fromJSON('["draft", "release"]'), inputs.publish) && (inputs.publish == 'draft' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      actions: read
      contents: write
    concurrency:
      group: layers-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the source run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FROM_RUN: ${{ inputs.from_run }}
          MODE: ${{ inputs.publish }}
        run: scripts/check-run.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: region-*
          path: upload
          run-id: ${{ inputs.from_run || github.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.publish }}
          TAG: ${{ inputs.tag }}
          DIR: ${{ github.workspace }}/upload
        run: scripts/publish.sh

  finalize:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == 'finalize' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: layers-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify and publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/finalize.sh

  check:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == 'check' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the draft release without publishing it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: "1"
        run: scripts/finalize.sh
