name: Layers

on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Geofabrik paths = mapsforge map keys, separated by spaces or commas (europe/luxembourg europe/germany/bayern); all = every key in mapping/poly, with the parts of mapping/region-parts.json"
        default: "europe/luxembourg"
      types:
        description: "Layers to build"
        type: choice
        options: [all, tourist, dem, contours]
        default: all
      dem_reuse:
        description: "changed = keep dem and contours from the previous release where their sources are unchanged (mapping/dem-manifest.json), all = build them for every region"
        type: choice
        options: [changed, all]
        default: changed
      parallel:
        description: "Concurrent pyhgtmap processes for contours"
        default: "2"
      writer:
        description: "Map writer for the tourist layer: ram (fast, memory-hungry), hd, or auto (hd when the filtered input exceeds 400 MB)"
        type: choice
        options: [auto, ram, hd]
        default: auto
      publish:
        description: "none = artifacts only, draft = upload to a draft release, release = build, upload and publish (main only), finalize = verify the draft release and publish it without building (main only), check = the same verification without publishing"
        type: choice
        options: [none, draft, release, finalize, check]
        default: none
      tag:
        description: "Release tag layers-YYYY-MM[suffix]; default layers-<current year-month> (a published tag cannot be reused, use a suffix such as layers-2026-10b)"
        default: ""
      from_run:
        description: "Publish the artifacts of this earlier run (run id) without building; use with publish=draft or release"
        default: ""
      osm_source:
        description: "OSM data for the tourist layer and the border: aws = regions cut from the weekly planet (AWS Open Data), geofabrik = Geofabrik extracts, sample = the small extracts in tests/osm (pull request checks)"
        type: choice
        options: [aws, geofabrik, sample]
        default: aws
      planet:
        description: "Planet for osm_source=aws, planet-YYMMDD; default the newest with an .md5"
        default: ""
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/layers.yml"
      - "scripts/**"
      - "mapping/**"

permissions:
  contents: read

concurrency:
  group: layers-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      borders: ${{ steps.list.outputs.borders }}
      whole: ${{ steps.list.outputs.whole }}
      osm: ${{ steps.osm.outputs.osm }}
      planet: ${{ steps.osm.outputs.planet }}
      streams: ${{ steps.osm.outputs.streams }}
      slices: ${{ steps.osm.outputs.slices }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the expansion of regions=all
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          parts=$(python3 scripts/region-list.py all | grep -c ':')
          tourist=$(python3 scripts/region-list.py --types tourist all | grep -c ':' || true)
          dem=$(python3 scripts/region-list.py --types dem all | grep -c ':')
          echo "parts: types=all $parts, types=tourist $tourist, types=dem $dem"
          [ "$parts" -gt 0 ] && [ "$tourist" -eq 0 ] && [ "$dem" -eq "$parts" ] \
            && [ "$(python3 scripts/region-list.py --types tourist europe/norway:1/4)" = europe/norway:1/4 ]
      - id: list
        env:
          # A pull request builds Monaco, whose OSM sample is kept in tests/osm (and whose dem and contours are kept, dem-manifest.json).
          REGIONS: ${{ inputs.regions || 'europe/monaco' }}
          TYPES: ${{ inputs.types || 'all' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, subprocess
          regions = [r for r in re.split(r'[\s,]+', os.environ['REGIONS']) if r]
          if 'all' in regions:
              # With types=tourist without the parts of mapping/region-parts.json, which build only dem and contours.
              regions = subprocess.run(['python3', 'scripts/region-list.py', '--types', os.environ['TYPES']] + regions, check=True, capture_output=True, text=True).stdout.split()
          if len(set(regions)) > 256:
              raise SystemExit('%d regions; a job matrix holds at most 256' % len(set(regions)))
          for r in regions:
              if not re.fullmatch(r'[a-z0-9-]+(/[a-z0-9-]+)*(=[a-z0-9-]+(/[a-z0-9-]+)*)?(:[1-9][0-9]*/[1-9][0-9]*(/(lat|lon))?)?', r):
                  raise SystemExit('Invalid region: ' + r)
          print('matrix=' + json.dumps({'region': sorted(set(regions))}))
          print('borders=' + json.dumps({'region': sorted({r.split(':')[0] for r in regions})}))
          # Regions built whole (not in parts): only these have a tourist layer.
          print('whole=' + json.dumps(sorted({r for r in regions if ':' not in r})))
          PY
      # A pull request uses the OSM samples in tests/osm, so that its checks need neither the whole planet nor Geofabrik;
      # it falls back to Geofabrik while a sample is missing.
      - id: osm
        env:
          OSM_SOURCE: ${{ inputs.osm_source || 'sample' }}
          EVENT: ${{ github.event_name }}
          PLANET: ${{ inputs.planet }}
          REGIONS: ${{ steps.list.outputs.borders }}
          SKIP: ${{ contains(fromJSON('["finalize", "check"]'), inputs.publish) || inputs.from_run != '' }}
        run: |
          if [ "$SKIP" = true ] || [ "$OSM_SOURCE" = geofabrik ]; then
            echo "osm=geofabrik" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$OSM_SOURCE" = sample ]; then
            missing=$(python3 -c 'import json,os; [print(r) for r in json.loads(os.environ["REGIONS"])["region"] if not os.path.isfile("tests/osm/%s.osm.pbf" % r.split("=")[0].replace("/", "_"))]')
            if [ -z "$missing" ]; then
              echo "osm=sample" >> "$GITHUB_OUTPUT"
            elif [ "$EVENT" = pull_request ]; then
              echo "::warning::No OSM sample in tests/osm for: $missing; using Geofabrik"
              echo "osm=geofabrik" >> "$GITHUB_OUTPUT"
            else
              echo "No OSM sample in tests/osm for: $missing (workflow OSM test sample)" >&2
              exit 1
            fi
            exit 0
          fi
          planet=$(python3 scripts/planet-latest.py "$PLANET")
          mapfile -t keys < <(python3 -c 'import json,os; [print(r.split("=")[0]) for r in json.loads(os.environ["REGIONS"])["region"]]')
          streams=$(python3 scripts/osm-blocks.py streams "${keys[@]}")
          slices=$(python3 scripts/osm-blocks.py slices "${keys[@]}")
          echo "Planet $planet, streams $streams, slices $slices"
          { echo "osm=aws"; echo "planet=$planet"; echo "streams=$streams"; echo "slices=$slices"; } >> "$GITHUB_OUTPUT"

  planet:
    needs: plan
    if: ${{ needs.plan.outputs.osm == 'aws' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.streams) }}
    env:
      PLANET: ${{ needs.plan.outputs.planet }}
      BLOCKS: ${{ matrix.blocks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          aws --version || true
      - name: Blocks
        id: blocks
        run: |
          read -ra blocks <<< "$BLOCKS"
          [ ${#blocks[@]} -le 4 ] || { echo "More than 4 blocks in a stream" >&2; exit 1; }
          for i in "${!blocks[@]}"; do echo "b$((i + 1))=${blocks[$i]}" >> "$GITHUB_OUTPUT"; done
          ( while sleep 60; do echo "resources: $(free -m | sed -n 2p) | disk: $(df -m / | tail -1 | tr -s " " | cut -d" " -f3,4) MB | blocks: $(du -sm blocks 2>/dev/null | cut -f1) MB"; done ) &
          monitor=$!
          OUT="$PWD/out" scripts/osm-planet.sh "$PLANET" "$PWD/blocks" "${blocks[@]}"
          kill "$monitor" 2>/dev/null || true
      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "### Planet $PLANET, blocks $BLOCKS"
            echo '| step | time [s] | RAM [MB] | rc |'
            echo '|---|---|---|---|'
            [ -f out/measurements.tsv ] && awk -F'\t' '{printf "| %s | %s | %s | %s |\n",$1,$2,$3,$4}' out/measurements.tsv
            echo
            ls -l blocks
            df -h / | tail -1
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # One artifact per block, so that each region job downloads only its block; a stream has at most 4 blocks (osm-blocks.py check).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osm-block-${{ steps.blocks.outputs.b1 }}
          path: |
            blocks/${{ steps.blocks.outputs.b1 }}.osm.pbf
            blocks/planet.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.blocks.outputs.b2 != '' }}
        with:
          name: osm-block-${{ steps.blocks.outputs.b2 }}
          path: |
            blocks/${{ steps.blocks.outputs.b2 }}.osm.pbf
            blocks/planet.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.blocks.outputs.b3 != '' }}
        with:
          name: osm-block-${{ steps.blocks.outputs.b3 }}
          path: |
            blocks/${{ steps.blocks.outputs.b3 }}.osm.pbf
            blocks/planet.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.blocks.outputs.b4 != '' }}
        with:
          name: osm-block-${{ steps.blocks.outputs.b4 }}
          path: |
            blocks/${{ steps.blocks.outputs.b4 }}.osm.pbf
            blocks/planet.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  # With osm_source=aws: the OSM extracts osm-<region> of all regions, cut from their planet block in slices of at most 8 regions
  # of one block (scripts/osm-blocks.py slices), so that a block is downloaded once per slice and not once per region.
  split:
    needs: [plan, planet]
    if: ${{ !cancelled() && needs.plan.outputs.osm == 'aws' && needs.planet.result != 'cancelled' && !contains(fromJSON('["finalize", "check"]'), inputs.publish) && inputs.from_run == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.slices) }}
    env:
      BLOCK: ${{ matrix.block }}
      REGIONS: ${{ matrix.regions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: osm-block-${{ matrix.block }}
          path: block
      - name: OSM extracts
        id: split
        run: |
          read -ra keys <<< "$REGIONS"
          [ ${#keys[@]} -le 8 ] || { echo "More than 8 regions in a slice" >&2; exit 1; }
          ( while sleep 60; do echo "resources: $(free -m | sed -n 2p) | disk: $(df -m / | tail -1 | tr -s " " | cut -d" " -f3,4) MB"; done ) &
          monitor=$!
          OUT="$PWD/out" WORK="$PWD/work" scripts/osm-split.sh "block/$BLOCK.osm.pbf" osm "${keys[@]}"
          kill "$monitor" 2>/dev/null || true
          for i in "${!keys[@]}"; do
            base=${keys[$i]//\//_}
            cp block/planet.txt "osm/$base/"
            echo "r$((i + 1))=$base" >> "$GITHUB_OUTPUT"
          done
          rm -rf block
      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "### Block $BLOCK: $REGIONS"
            echo '| step | time [s] | RAM [MB] | rc |'
            echo '|---|---|---|---|'
            [ -f out/measurements.tsv ] && awk -F'\t' '{printf "| %s | %s | %s | %s |\n",$1,$2,$3,$4}' out/measurements.tsv
            echo
            ls -l osm/*/region.osm.pbf 2>/dev/null || true
            df -h / | tail -1
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # One artifact per region, as the build job downloads only its region; a slice has at most 8 regions (osm-blocks.py SLICE_SIZE).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.split.outputs.r1 != '' }}
        with:
          name: osm-${{ steps.split.outputs.r1 }}
          path: |
            osm/${{ steps.split.outputs.r1 }}/region.osm.pbf
            osm/${{ steps.split.outputs.r1 }}/planet.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.split.outputs.r2 != '' }}
        with:
          name: osm-${{ steps.split.outputs.r2 }}
          path: |
            osm/${{ steps.split.outputs.r2 }}/region.osm.pbf
            osm/${{ steps.split.outputs.r2 }}/planet.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.split.outputs.r3 != '' }}
        with:
          name: osm-${{ steps.split.outputs.r3 }}
          path: |
            osm/${{ steps.split.outputs.r3 }}/region.osm.pbf
            osm/${{ steps.split.outputs.r3 }}/planet.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.split.outputs.r4 != '' }}
        with:
          name: osm-${{ steps.split.outputs.r4 }}
          path: |
            osm/${{ steps.split.outputs.r4 }}/region.osm.pbf
            osm/${{ steps.split.outputs.r4 }}/planet.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.split.outputs.r5 != '' }}
        with:
          name: osm-${{ steps.split.outputs.r5 }}
          path: |
            osm/${{ steps.split.outputs.r5 }}/region.osm.pbf
            osm/${{ steps.split.outputs.r5 }}/planet.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.split.outputs.r6 != '' }}
        with:
          name: osm-${{ steps.split.outputs.r6 }}
          path: |
            osm/${{ steps.split.outputs.r6 }}/region.osm.pbf
            osm/${{ steps.split.outputs.r6 }}/planet.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.split.outputs.r7 != '' }}
        with:
          name: osm-${{ steps.split.outputs.r7 }}
          path: |
            osm/${{ steps.split.outputs.r7 }}/region.osm.pbf
            osm/${{ steps.split.outputs.r7 }}/planet.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.split.outputs.r8 != '' }}
        with:
          name: osm-${{ steps.split.outputs.r8 }}
          path: |
            osm/${{ steps.split.outputs.r8 }}/region.osm.pbf
            osm/${{ steps.split.outputs.r8 }}/planet.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  # The region border for dem and contours (from the OSM extract of the region with osm_source=aws or sample) and, with osm_source=sample,
  # the OSM extract of the region for the build job.
  border:
    needs: [plan, split]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.split.result != 'cancelled' && !contains(fromJSON('["finalize", "check"]'), inputs.publish) && inputs.from_run == '' && (contains(fromJSON('["all", "dem", "contours", ""]'), inputs.types) || needs.plan.outputs.osm == 'sample') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.borders) }}
    env:
      REGION: ${{ matrix.region }}
      OSM: ${{ needs.plan.outputs.osm }}
      NEED_BORDER: ${{ contains(fromJSON('["all", "dem", "contours", ""]'), inputs.types) }}
      NEED_OSM: ${{ needs.plan.outputs.osm == 'sample' && contains(fromJSON('["all", "tourist", ""]'), inputs.types) && contains(fromJSON(needs.plan.outputs.whole), matrix.region) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('scripts/requirements.txt') }}
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          python3 -m venv "$HOME/venv"
          # requirements.txt is a complete pinned list, so dependencies are not resolved again (--no-deps).
          # pyhgtmap needs PyDrive2 (imported, not used here), which caps cryptography<44 and would keep cryptography on an old release.
          "$HOME/venv/bin/pip" install -q --no-deps -r scripts/requirements.txt
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"
      - id: art
        run: |
          KEY=${REGION%%=*}
          echo "name=border-${KEY//\//_}" >> "$GITHUB_OUTPUT"
          echo "osm=osm-${KEY//\//_}" >> "$GITHUB_OUTPUT"
      # The extract cut by the split job (osm_source=aws).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ env.OSM == 'aws' }}
        with:
          name: ${{ steps.art.outputs.osm }}
          path: osm
      - name: OSM sample
        if: ${{ env.OSM == 'sample' }}
        run: |
          KEY=${REGION%%=*}
          mkdir -p osm
          cp "tests/osm/${KEY//\//_}.osm.pbf" osm/region.osm.pbf
          cp "tests/osm/${KEY//\//_}.txt" osm/planet.txt
          ls -l osm
      - name: Border
        if: ${{ env.NEED_BORDER == 'true' }}
        run: |
          KEY=${REGION%%=*}
          export GEOFABRIK=${REGION#*=} BASE=${KEY//\//_} OUT="$PWD/out" WORK="$PWD/work"
          [ "$OSM" != geofabrik ] && export OSM_PBF="$PWD/osm/region.osm.pbf"
          mkdir -p out work
          scripts/build-border.sh "$OUT/border.poly"
      - name: Summary
        if: ${{ always() }}
        run: |
          if [ -f out/measurements.tsv ]; then cat out/measurements.tsv; fi
          df -h / | tail -1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ env.NEED_BORDER == 'true' }}
        with:
          name: ${{ steps.art.outputs.name }}
          path: out/border.poly
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ env.NEED_OSM == 'true' }}
        with:
          name: ${{ steps.art.outputs.osm }}
          path: |
            osm/region.osm.pbf
            osm/planet.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [plan, split, border]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.split.result != 'cancelled' && needs.border.result != 'cancelled' && !contains(fromJSON('["finalize", "check"]'), inputs.publish) && inputs.from_run == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      REGION: ${{ matrix.region }}
      TYPES: ${{ inputs.types || 'all' }}
      WRITER_TYPE: ${{ inputs.writer || 'auto' }}
      DEM_REUSE: ${{ inputs.dem_reuse || 'changed' }}
      PARALLEL: ${{ inputs.parallel || '2' }}
      JAVA_OPTS: -Xmx10g
      TAG: ${{ inputs.tag }}
      OSM: ${{ needs.plan.outputs.osm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('scripts/requirements.txt') }}
      # Osmosis and the merged mapsforge-map-writer plugin; install-tools.sh downloads and builds nothing when they are restored.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tools/osmosis
            ~/.openstreetmap/osmosis/plugins
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/install-tools.sh', 'scripts/writer/pom.xml') }}
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool gdal-bin python3-numpy zip unzip
          python3 -m venv "$HOME/venv"
          # requirements.txt is a complete pinned list, so dependencies are not resolved again (--no-deps).
          # pyhgtmap needs PyDrive2 (imported, not used here), which caps cryptography<44 and would keep cryptography on an old release.
          "$HOME/venv/bin/pip" install -q --no-deps -r scripts/requirements.txt
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"
          scripts/install-tools.sh
      - name: Region border
        run: |
          KEY=${REGION%%:*}; KEY=${KEY%%=*}
          echo "BORDER_NAME=border-${KEY//\//_}" >> "$GITHUB_ENV"
          echo "OSM_NAME=osm-${KEY//\//_}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.border.result == 'success' }}
        continue-on-error: true
        with:
          name: ${{ env.BORDER_NAME }}
          path: border
      # The OSM extract of the region (osm_source=aws or sample); without it the tourist layer fails instead of falling back to Geofabrik.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ env.OSM != 'geofabrik' && !contains(matrix.region, ':') && contains(fromJSON('["all", "tourist"]'), env.TYPES) }}
        continue-on-error: true
        with:
          name: ${{ env.OSM_NAME }}
          path: osm
      - name: Build
        run: |
          [ -s border/border.poly ] && export BORDER_POLY="$PWD/border/border.poly"
          if [ "$OSM" != geofabrik ]; then
            export OSM_PBF="$PWD/osm/region.osm.pbf"
            IFS=$'\t' read -r OSM_PLANET OSM_STAMP < osm/planet.txt || true
            export OSM_PLANET OSM_STAMP
          fi
          OUT="$PWD/out" WORK="$PWD/work" scripts/build-region.sh
      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "### $REGION"
            echo '| step | time [s] | RAM [MB] | rc |'
            echo '|---|---|---|---|'
            [ -f out/measurements.tsv ] && awk -F'\t' '{printf "| %s | %s | %s | %s |\n",$1,$2,$3,$4}' out/measurements.tsv
            echo
            ls -l out
            df -h / | tail -1
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Artifact name
        id: art
        run: |
          KEY=${REGION%%:*}; KEY=${KEY%%=*}
          if [[ "$REGION" == *:* ]]; then SPEC=${REGION##*:}; KEY="$KEY-p${SPEC%%/*}"; fi
          echo "name=region-${KEY//\//_}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.art.outputs.name }}
          path: |
            out/*.map
            out/*.zip
            out/*.poly
            out/layers.json
            out/SHA256SUMS
            out/measurements.tsv
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: ${{ !cancelled() && (needs.build.result != 'skipped' || inputs.from_run != '') && github.event_name == 'workflow_dispatch' && contains(fromJSON('["draft", "release"]'), inputs.publish) && (inputs.publish == 'draft' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      actions: read
      contents: write
    concurrency:
      group: layers-publish
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the source run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FROM_RUN: ${{ inputs.from_run }}
          MODE: ${{ inputs.publish }}
        run: scripts/check-run.sh
      # One artifact at a time (download-artifact fetched all of a full run at once and hit the secondary rate limit of the API).
      - name: Download the built regions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ inputs.from_run || github.run_id }}
          DIR: ${{ github.workspace }}/upload
        run: scripts/download-artifacts.sh
      - name: Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.publish }}
          TAG: ${{ inputs.tag }}
          DIR: ${{ github.workspace }}/upload
        run: scripts/publish.sh

  # After publish=draft, the same verification as publish=check on the draft just written (finalize.sh with DRY_RUN=1):
  # it publishes nothing; a failure shows that the draft is not ready for finalize.
  check-draft:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' && inputs.publish == 'draft' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: layers-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the draft release without publishing it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.publish.outputs.tag }}
          DRY_RUN: "1"
        run: |
          [ -n "$TAG" ] || { echo "The publish job did not report its tag" >&2; exit 1; }
          scripts/finalize.sh

  finalize:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == 'finalize' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: layers-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify and publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/finalize.sh

  check:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == 'check' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the draft release without publishing it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          DRY_RUN: "1"
        run: scripts/finalize.sh
