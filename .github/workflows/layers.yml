name: Layers

on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Geofabrik paths = mapsforge map keys, separated by spaces or commas (europe/luxembourg europe/germany/bayern)"
        default: "europe/luxembourg"
      types:
        description: "Layers to build"
        type: choice
        options: [all, routes, dem, contours]
        default: all
      parallel:
        description: "Concurrent pyhgtmap processes for contours"
        default: "2"
      writer:
        description: "Map writer for routes: ram (fast, memory-hungry) or hd"
        type: choice
        options: [ram, hd]
        default: ram
      publish:
        description: "none = artifacts only, draft = upload to a draft release, release = publish the release (main only)"
        type: choice
        options: [none, draft, release]
        default: none
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/layers.yml"
      - "scripts/**"
      - "mapping/**"

permissions:
  contents: read

concurrency:
  group: layers-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - id: list
        env:
          REGIONS: ${{ inputs.regions || 'europe/luxembourg' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          regions = [r for r in re.split(r'[\s,]+', os.environ['REGIONS']) if r]
          for r in regions:
              if not re.fullmatch(r'[a-z0-9-]+(/[a-z0-9-]+)*', r):
                  raise SystemExit('Invalid region: ' + r)
          print('matrix=' + json.dumps({'region': sorted(set(regions))}))
          PY

  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      REGION: ${{ matrix.region }}
      TYPES: ${{ inputs.types || 'all' }}
      WRITER_TYPE: ${{ inputs.writer || 'ram' }}
      PARALLEL: ${{ inputs.parallel || '2' }}
      JAVA_OPTS: -Xmx10g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool gdal-bin python3-numpy zip unzip
          python3 -m venv "$HOME/venv"
          "$HOME/venv/bin/pip" install -q -r scripts/requirements.txt
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"
          scripts/install-tools.sh
      - name: Build
        run: OUT="$PWD/out" WORK="$PWD/work" scripts/build-region.sh
      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "### $REGION"
            echo '| step | time [s] | RAM [MB] | rc |'
            echo '|---|---|---|---|'
            [ -f out/measurements.tsv ] && awk -F'\t' '{printf "| %s | %s | %s | %s |\n",$1,$2,$3,$4}' out/measurements.tsv
            echo
            ls -l out
            df -h / | tail -1
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Artifact name
        id: art
        run: echo "name=region-${REGION//\//_}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.art.outputs.name }}
          path: |
            out/*.map
            out/*.zip
            out/*.poly
            out/layers.json
            out/SHA256SUMS
            out/measurements.tsv
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'skipped' && github.event_name == 'workflow_dispatch' && inputs.publish != 'none' && (inputs.publish == 'draft' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    concurrency:
      group: layers-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: region-*
          path: upload
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.publish }}
          DIR: ${{ github.workspace }}/upload
        run: scripts/publish.sh
