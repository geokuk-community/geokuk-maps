name: Region outlines

# Refreshes mapping/poly/<key>.poly from the mapsforge polygons (maps/poly on the Hochschule Esslingen mirror of
# download.mapsforge.org) with scripts/update-poly.sh, one file at a time, and proposes the changes as a pull request.
# Suggested schedule once verified: monthly (see README.md, Workflows and data sources); not enabled.
on:
  workflow_dispatch:
    inputs:
      keys:
        description: "Region keys separated by spaces (europe/czech-republic europe/germany/bayern); empty = every key in mapping/poly"
        default: ""

permissions:
  contents: read

concurrency:
  group: poly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.update.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: update
        env:
          KEYS: ${{ inputs.keys }}
        run: |
          read -ra keys <<< "$KEYS"
          for k in "${keys[@]}"; do [[ "$k" =~ ^[a-z0-9-]+(/[a-z0-9-]+)*$ ]] || { echo "Invalid key: $k" >&2; exit 2; }; done
          rc=0
          scripts/update-poly.sh "${keys[@]}" 2>&1 | tee update.log || rc=$?
          git add -A mapping/poly
          git diff --cached --stat
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          git diff --cached --binary > poly.patch
          {
            echo "### Region outlines"
            echo '```'
            tail -n 20 update.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.update.outputs.changed == 'true' }}
        with:
          name: poly-patch
          path: |
            poly.patch
            update.log
          retention-days: 7

  # Only this job may write: it pushes the branch update/poly and opens (or updates) the pull request.
  pull-request:
    needs: update
    if: ${{ needs.update.outputs.changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: poly-patch
          path: ${{ runner.temp }}/poly
      - name: Pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch=update/poly
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git apply --index "$RUNNER_TEMP/poly/poly.patch"
          git commit -q -m "Refresh the region outlines from the mapsforge mirror" -m "Generated by the Region outlines workflow: $RUN_URL"
          git push -f origin "$branch"
          {
            echo "Outlines refreshed by scripts/update-poly.sh from the mapsforge mirror (maps/poly)."
            echo
            echo "Run: $RUN_URL"
            echo
            echo "<pre>"
            git show --stat --format= HEAD | tail -n 30
            echo "</pre>"
          } > "$RUNNER_TEMP/body.md"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$branch" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --draft --base main --head "$branch" --title "Refresh the region outlines" --body-file "$RUNNER_TEMP/body.md"
          fi
