name: ČÚZK probe
on:
  push:
    branches: [layers/cuzk-dmr4g]
    paths: [.github/workflows/cuzk-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin python3-numpy
          python3 -m venv "$HOME/venv"
          "$HOME/venv/bin/pip" install -q -r scripts/requirements.txt
      - name: Liberecky kraj
        run: |
          export PATH="$HOME/venv/bin:$PATH"
          BBOX=50.39,14.43,51.05,15.40
          mkdir -p w
          /usr/bin/time -v python3 scripts/cop2hgt.py $BBOX w/hgt w/cop 2>&1 | grep -E "Elapsed|Maximum resident|HGT tiles|Copernicus"
          cp -r w/hgt w/hgt-cop
          /usr/bin/time -v python3 scripts/cuzk2hgt.py $BBOX w/hgt w/cz 2>&1 | grep -v -E "^\s+(Page|Swaps|File|Socket|Signals|Volun|Invol|Average|Major|Minor|Exit|Percent|System|User|Command)" 
          ls -l w/hgt; df -h / | tail -1
