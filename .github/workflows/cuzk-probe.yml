name: ČÚZK probe
on:
  push:
    branches: [layers/cuzk-dmr4g]
    paths: [.github/workflows/cuzk-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin python3-numpy
          python3 -m venv "$HOME/venv"
          "$HOME/venv/bin/pip" install -q -r scripts/requirements.txt
      - name: Seam
        run: |
          export PATH="$HOME/venv/bin:$PATH"
          BBOX=50.6,15.4,50.9,16.0
          mkdir -p w
          python3 scripts/cop2hgt.py $BBOX w/cop w/cw
          python3 - <<'PY'
          import base64, importlib.util, io, os, shutil, sys
          import numpy as np
          sys.path.insert(0, 'scripts')
          spec = importlib.util.spec_from_file_location('c', 'scripts/cuzk2hgt.py'); c = importlib.util.module_from_spec(spec); spec.loader.exec_module(c)
          south, west, north, east = 50.6, 15.4, 50.9, 16.0
          codes = c.sheets(south, west, north, east)
          os.makedirs('w/cz', exist_ok=True)
          grid = 'w/cz/g.i16'
          c.stage_a(codes, grid)
          for name, blend in (('noblend', 1), ('blend', 10)):
              c.BLEND = blend
              c.PAD = blend + 2
              shutil.copytree('w/cop', 'w/' + name)
              c.stage_b(south, west, north, east, 'w/' + name, 'w/cz', grid)
          def read(d): return np.fromfile(d + '/N50E015.hgt', dtype='>i2').reshape(3601, 3601).astype(np.float32)
          cop, nb, bl = read('w/cop'), read('w/noblend'), read('w/blend')
          def shade(z):
              dzdx = (np.roll(z, -1, 1) - np.roll(z, 1, 1)) / (2 * 19.6); dzdy = (np.roll(z, -1, 0) - np.roll(z, 1, 0)) / (2 * 30.9)
              slope = np.arctan(np.hypot(dzdx, dzdy)); aspect = np.arctan2(dzdy, -dzdx)
              az = np.radians(45); zen = np.radians(45)
              return np.clip(np.cos(zen) * np.cos(slope) + np.sin(zen) * np.sin(slope) * np.cos(az - aspect), 0, 1)
          r0, c0 = int((51 - 50.742) * 3600), int(0.70 * 3600)  # the Krkonose ridge, CZ/PL border east of Snezka
          # find a row/column window where DMR coverage ends
          valid = (nb != cop)
          ys, xs = np.nonzero(valid[r0 - 300:r0 + 300, c0 - 450:c0 + 450])
          print('DMR pixels in window', len(ys))
          sl = (slice(r0 - 150, r0 + 150), slice(c0 - 200, c0 + 200))
          from PIL import Image
          panels = [np.uint8(255 * shade(z)[sl]) for z in (cop, nb, bl)]
          img = Image.fromarray(np.hstack(panels))
          buf = io.BytesIO(); img.save(buf, 'JPEG', quality=72)
          print('IMG_BEGIN'); print(base64.b64encode(buf.getvalue()).decode()); print('IMG_END')
          # profile across the coverage edge
          d = np.abs(nb - cop)
          row = r0
          print('row', row, 'cop', cop[row, c0 - 200:c0 + 200:10].astype(int).tolist())
          print('noblend', nb[row, c0 - 200:c0 + 200:10].astype(int).tolist())
          print('blend', bl[row, c0 - 200:c0 + 200:10].astype(int).tolist())
          m = (nb != cop)
          print('median |DMR-Cop| in coverage (m):', float(np.median(d[m])), 'p90', float(np.percentile(d[m], 90)))
          PY
