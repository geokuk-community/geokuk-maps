name: Copernicus tile list

# Refreshes mapping/copernicus-tilelist.txt from tileList.txt of the AWS Open Data bucket copernicus-dem-30m (one download) with
# scripts/update-tilelist.sh and proposes the change as a pull request. A changed list changes the Copernicus fingerprint of the
# regions it touches, so their dem and contours are built in the next cycle (mapping/dem-manifest.json).
# Suggested schedule once verified: quarterly (see README.md, Workflows and data sources); not enabled.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-tilelist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.update.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: update
        run: |
          set -o pipefail
          rc=0
          scripts/update-tilelist.sh 2>&1 | tee update.log || rc=$?
          git add -A mapping/copernicus-tilelist.txt
          git diff --cached --stat
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          git diff --cached --binary > update.patch
          {
            echo "### Copernicus tile list"
            echo '```'
            tail -n 20 update.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.update.outputs.changed == 'true' }}
        with:
          name: update-patch
          path: |
            update.patch
            update.log
          retention-days: 7

  # Only this job may write: it pushes the branch update/tilelist and opens (or updates) the pull request.
  pull-request:
    needs: update
    if: ${{ needs.update.outputs.changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-patch
          path: ${{ runner.temp }}/update
      - name: Pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch=update/tilelist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git apply --index "$RUNNER_TEMP/update/update.patch"
          git commit -q -m "Refresh the Copernicus tile list" -m "Generated by the Copernicus tile list workflow: $RUN_URL"
          git push -f origin "$branch"
          {
            echo "Tile list refreshed by scripts/update-tilelist.sh from https://copernicus-dem-30m.s3.amazonaws.com/tileList.txt."
            echo
            echo "Run: $RUN_URL"
            echo
            echo "<pre>"
            tail -n 30 "$RUNNER_TEMP/update/update.log"
            git show --stat --format= HEAD | tail -n 10
            echo "</pre>"
          } > "$RUNNER_TEMP/body.md"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$branch" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --draft --base main --head "$branch" --title "Refresh the Copernicus tile list" --body-file "$RUNNER_TEMP/body.md"
          fi
